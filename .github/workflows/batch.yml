name: Aether Batch Registration

on:
  workflow_dispatch:
    inputs:
      batch_start:
        description: 'Start alias number (e.g. 2)'
        required: true
        default: '2'
      batch_end:
        description: 'End alias number (e.g. 5)'
        required: true
        default: '5'

jobs:
  register:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install httpx pydantic pydantic-settings capsolver
          pip install beautifulsoup4

      - name: Generate .env
        run: |
          cat > .env << 'ENVEOF'
          GMAIL_EMAIL=${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          ACCOUNT_PASSWORD=${{ secrets.ACCOUNT_PASSWORD }}
          ACCOUNT_EMAIL_BASE=${{ secrets.ACCOUNT_EMAIL_BASE }}
          CAPSOLVER_API_KEY=${{ secrets.CAPSOLVER_API_KEY }}
          TURNSTILE_TOKEN=${{ secrets.TURNSTILE_TOKEN }}
          TARGET_GROUPS=${{ secrets.TARGET_GROUPS }}
          BATCH_START=${{ github.event.inputs.batch_start || '2' }}
          BATCH_END=${{ github.event.inputs.batch_end || '5' }}
          ENVEOF

      - name: Run registration
        run: python -m src.main

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: aether-accounts
          path: aether_accounts.json
          retention-days: 7

      - name: Print summary
        if: success() || failure()
        run: |
          if [ -f aether_accounts.json ]; then
            echo "=== SUMMARY ==="
            python -c "
import json
with open('aether_accounts.json') as f:
    d = json.load(f)
for a in d.get('accounts', []):
    print(f\"  [{a['email']}]\")
    for k in a.get('api_keys', []):
        print(f\"    {k['group_name']}: {k['key_value']}\")
    print()
"
          fi
